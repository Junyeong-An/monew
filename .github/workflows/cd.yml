name: CD

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  id-token: write

jobs:
  # ════ Job 1: Build and push Docker image ══════════════════════
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download config files from S3
        run: |
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/prod/application.yaml src/main/resources/application.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/prod/application-prod.yaml src/main/resources/application-prod.yaml

      - name: Configure AWS credentials (us-east-1 for Public ECR)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push Docker image
        run: |
          IMAGE_URI=${{ vars.ECR_REPOSITORY_URI }}
          docker build -t $IMAGE_URI:${{ github.sha }} .
          docker push $IMAGE_URI:${{ github.sha }}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag $IMAGE_URI:${{ github.sha }} $IMAGE_URI:latest
            docker push $IMAGE_URI:latest
          else
            docker tag $IMAGE_URI:${{ github.sha }} $IMAGE_URI:staging
            docker push $IMAGE_URI:staging
          fi

  # ════ Job 2: Deploy to ECS ════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register new task definition revision
        run: |
          NEW_IMAGE=${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          ENV_FILE_ARN="arn:aws:s3:::${{ secrets.AWS_S3_BUCKET }}/config/monew.env"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition)
          NEW_TASK_DEF=$(echo $TASK_DEF \
            | jq --arg IMAGE "$NEW_IMAGE" \
                 --arg ENV_FILE_ARN "$ENV_FILE_ARN" \
              '.containerDefinitions[0].image = $IMAGE
               | .containerDefinitions[0].environmentFiles = [{"value": $ENV_FILE_ARN, "type": "s3"}]
               | del(.taskDefinitionArn, .revision, .status,
                     .requiresAttributes, .compatibilities,
                     .registeredAt, .registeredBy)')
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV

      - name: Stop existing tasks (free-tier resource)
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}

          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --query 'services[0].runningCount' \
            --output text)
          test "$RUNNING_COUNT" = "0"

      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition $NEW_REVISION \
            --desired-count 1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}
          echo "Deployment complete!"

      - name: Verify deployment status
        run: |
          aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --query "services[0].deployments"
