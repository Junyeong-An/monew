name: Collect Review Data

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

jobs:
  collect:
    if: github.event.review.user.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    steps:
      - name: Collect review metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_HTML_URL: ${{ github.event.review.html_url }}
          REVIEWER: ${{ github.event.review.user.login }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments" \
            --jq 'length' 2>/dev/null || echo 0)
          COUNT=${COUNT:-0}

          APPROVAL_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --paginate 2>/dev/null \
            | jq -s '[.[][] ] | group_by(.user.login) | [.[] | last | select(.state == "APPROVED")] | length' \
            || echo 0)
          APPROVAL_COUNT=${APPROVAL_COUNT:-0}

          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_html_url "$PR_HTML_URL" \
            --argjson review_id "$REVIEW_ID" \
            --arg review_state "$REVIEW_STATE" \
            --arg review_html_url "$REVIEW_HTML_URL" \
            --arg reviewer "$REVIEWER" \
            --argjson comment_count "$COUNT" \
            --argjson approval_count "$APPROVAL_COUNT" \
            '{
              pr_number: $pr_number,
              pr_title: $pr_title,
              pr_html_url: $pr_html_url,
              review_id: $review_id,
              review_state: $review_state,
              review_html_url: $review_html_url,
              reviewer: $reviewer,
              comment_count: $comment_count,
              approval_count: $approval_count
            }' > review-data.json

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-data
          path: review-data.json
          retention-days: 1
